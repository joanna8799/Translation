<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8"><title>ReadTrans</title>
<style>
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:14px;margin:0;padding:12px;width:280px;color:#1f2328;background:#fff}
h1{font-size:15px;margin:0 0 6px}
.host{color:#6b6f76;font-size:12px;word-break:break-all;margin-bottom:10px}
label{display:flex;gap:8px;align-items:center;margin:6px 0}
.row{display:flex;gap:8px;margin-top:10px}
button{flex:1;font:inherit;padding:8px;border-radius:8px;border:1px solid #d9d5cc;background:#fff;cursor:pointer}
button.primary{background:#b23a2a;color:#fff;border-color:#b23a2a}
.status{margin-top:10px;font-size:12px;color:#6b6f76;min-height:1.4em}
a{color:#b23a2a}
</style></head>
<body>
<h1>ReadTrans</h1>
<div class="host" id="host"></div>
<label><input type="checkbox" id="autoAll">所有網站自動翻譯</label>
<label><input type="checkbox" id="autoHere">這個網站自動翻譯</label>
<div class="row"><button class="primary" id="translate">翻譯本頁</button><button id="restore">還原</button></div>
<div class="status" id="status"></div>
<div class="row"><button id="options">設定（翻譯引擎、漫畫語言）</button></div>
<script src="popup.js"></script>
</body></html>
