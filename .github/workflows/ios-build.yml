# 在 GitHub 的 macOS runner 上編譯兩個 iOS 技術驗證專案。
# 這個 repo 是公開的，macOS runner 免費。只做編譯（模擬器 SDK、不簽章），不跑實機。
name: iOS build

on:
  push:
    paths:
      - "ios-spike/**"
      - "ios-talk-spike/**"
      - ".github/workflows/ios-build.yml"
      - "!**/*.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: ios-talk-spike
            project: TalkSpike.xcodeproj
            scheme: TalkSpike
          - dir: ios-spike
            project: LiveSpike.xcodeproj
            scheme: LiveSpike
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode_26.4.1.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ${{ matrix.dir }}
        run: xcodegen generate

      - name: Build (iOS Simulator, no signing)
        working-directory: ${{ matrix.dir }}
        run: |
          set -o pipefail
          xcodebuild \
            -project "${{ matrix.project }}" \
            -scheme "${{ matrix.scheme }}" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD|Compiling|\*\* " || true
          echo "---- warnings (unique) ----"
          grep -E "warning:" build.log | sed -E 's#^.*/(ios-[a-z-]+)/#\1/#' | sort -u || echo "no warnings"
          echo "---- errors ----"
          grep -E "error:" build.log || echo "no errors"
          grep -q "BUILD SUCCEEDED" build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dir }}-build-log
          path: ${{ matrix.dir }}/build.log

  # 真機用的未簽章 .ipa：給 AltStore／Sideloadly 這類用免費 Apple ID 自行簽章安裝的工具。
  # 只做 TalkSpike（不需要 App Group 等特殊權限，免費帳號能簽）。
  ipa:
    runs-on: macos-26
    needs: build
    permissions:
      contents: write
    # 同一時間只讓一個 job 動 release，避免兩次推送互相覆蓋。
    concurrency:
      group: talkspike-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app && xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios-talk-spike
        run: xcodegen generate
      - name: Build for device (unsigned)
        working-directory: ios-talk-spike
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
          APP_BUILD: ${{ github.run_number }}
        run: |
          set -o pipefail
          xcodebuild \
            -project TalkSpike.xcodeproj \
            -scheme TalkSpike \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$APP_BUILD" \
            build 2>&1 | tee device-build.log | grep -E "error:|BUILD|\*\* " || true
          grep -q "BUILD SUCCEEDED" device-build.log
      - name: Package .ipa and AltStore source
        working-directory: ios-talk-spike
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
          APP_BUILD: ${{ github.run_number }}
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/TalkSpike.app Payload/
          # 版本號直接寫進 Info.plist（app 未簽章，AltStore 會重簽，改 plist 沒問題），
          # 再從同一個檔案讀回來產 altstore.json，AltStore 比對才不會對不上。
          PLIST=Payload/TalkSpike.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $APP_VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $APP_BUILD" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $APP_BUILD" "$PLIST"
          APP_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          APP_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
          echo "Info.plist version=$APP_VERSION build=$APP_BUILD bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"
          zip -qr TalkSpike-unsigned.ipa Payload
          cp App/Assets.xcassets/AppIcon.appiconset/icon-1024.png icon.png
          SIZE=$(stat -f%z TalkSpike-unsigned.ipa)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/talkspike-latest"
          NOTES="commit ${GITHUB_SHA:0:7}：$(git log -1 --pretty=%s | tr '"' "'")"
          cat > altstore.json <<JSON
          {
            "name": "TalkSpike 測試版",
            "identifier": "com.example.talkspike.source",
            "subtitle": "旅行即時口譯技術驗證",
            "description": "每次推送自動產出的未簽章測試版。由 AltStore 用你自己的 Apple ID 簽章安裝。",
            "iconURL": "${BASE}/icon.png",
            "website": "https://github.com/${GITHUB_REPOSITORY}",
            "tintColor": "#1E64C8",
            "featuredApps": ["com.example.talkspike"],
            "apps": [
              {
                "name": "TalkSpike",
                "bundleIdentifier": "com.example.talkspike",
                "developerName": "joanna8799",
                "subtitle": "一般耳機就能用的雙向即時口譯",
                "localizedDescription": "對方講外語，耳機裡聽中文；你講中文，翻成外語給對方看或唸出來。全部在 iPhone 上運算。",
                "iconURL": "${BASE}/icon.png",
                "tintColor": "#1E64C8",
                "category": "utilities",
                "versions": [
                  {
                    "version": "${APP_VERSION}",
                    "buildVersion": "${APP_BUILD}",
                    "date": "${DATE}",
                    "localizedDescription": "${NOTES}",
                    "downloadURL": "${BASE}/TalkSpike-unsigned.ipa",
                    "size": ${SIZE},
                    "minOSVersion": "26.0"
                  }
                ]
              }
            ]
          }
          JSON
          python3 -c "import json;json.load(open('altstore.json'));print('altstore.json valid')"
          ls -la TalkSpike-unsigned.ipa altstore.json icon.png
      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: TalkSpike-unsigned-ipa
          path: ios-talk-spike/TalkSpike-unsigned.ipa

      # 固定網址的 pre-release，手機上用 Safari 就能直接下載，不用登入 GitHub、不用解壓：
      # https://github.com/joanna8799/Translation/releases/download/talkspike-latest/TalkSpike-unsigned.ipa
      - name: Publish .ipa to rolling pre-release
        working-directory: ios-talk-spike
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="TalkSpike 1.0.${{ github.run_number }}（未簽章）"
          NOTES="自動產出，commit ${GITHUB_SHA:0:7}，分支 ${GITHUB_REF_NAME}。AltStore 來源網址：https://github.com/${GITHUB_REPOSITORY}/releases/download/talkspike-latest/altstore.json 。步驟見 ios-talk-spike/INSTALL.md。"
          # 不刪除重建（偶爾會吃到 403），改成：已存在就覆蓋資產並把 tag 移到新 commit；不存在才建立。失敗重試三次。
          for attempt in 1 2 3; do
            if gh release view talkspike-latest >/dev/null 2>&1; then
              gh release upload talkspike-latest TalkSpike-unsigned.ipa altstore.json icon.png --clobber \
                && gh release edit talkspike-latest --prerelease --title "$TITLE" --notes "$NOTES" \
                && git tag -f talkspike-latest "$GITHUB_SHA" \
                && git push -f origin talkspike-latest \
                && break
            else
              gh release create talkspike-latest TalkSpike-unsigned.ipa altstore.json icon.png \
                --target "$GITHUB_SHA" --prerelease --title "$TITLE" --notes "$NOTES" \
                && break
            fi
            echo "release step failed (attempt $attempt), retrying in 15s"
            sleep 15
            [ "$attempt" = 3 ] && exit 1
          done
          gh release view talkspike-latest --json assets --jq '.assets[] | "\(.name) \(.size) bytes"'
