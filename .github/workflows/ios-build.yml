# 在 GitHub 的 macOS runner 上編譯兩個 iOS 技術驗證專案。
# 這個 repo 是公開的，macOS runner 免費。只做編譯（模擬器 SDK、不簽章），不跑實機。
name: iOS build

on:
  push:
    paths:
      - "ios-spike/**"
      - "ios-talk-spike/**"
      - ".github/workflows/ios-build.yml"
      - "!**/*.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: ios-talk-spike
            project: TalkSpike.xcodeproj
            scheme: TalkSpike
          - dir: ios-spike
            project: LiveSpike.xcodeproj
            scheme: LiveSpike
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode_26.4.1.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ${{ matrix.dir }}
        run: xcodegen generate

      - name: Build (iOS Simulator, no signing)
        working-directory: ${{ matrix.dir }}
        run: |
          set -o pipefail
          xcodebuild \
            -project "${{ matrix.project }}" \
            -scheme "${{ matrix.scheme }}" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD|Compiling|\*\* " || true
          echo "---- warnings (unique) ----"
          grep -E "warning:" build.log | sed -E 's#^.*/(ios-[a-z-]+)/#\1/#' | sort -u || echo "no warnings"
          echo "---- errors ----"
          grep -E "error:" build.log || echo "no errors"
          grep -q "BUILD SUCCEEDED" build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dir }}-build-log
          path: ${{ matrix.dir }}/build.log

  # 真機用的未簽章 .ipa：給 AltStore／Sideloadly 這類用免費 Apple ID 自行簽章安裝的工具。
  # 只做 TalkSpike（不需要 App Group 等特殊權限，免費帳號能簽）。
  ipa:
    runs-on: macos-26
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app && xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios-talk-spike
        run: xcodegen generate
      - name: Build for device (unsigned)
        working-directory: ios-talk-spike
        run: |
          set -o pipefail
          xcodebuild \
            -project TalkSpike.xcodeproj \
            -scheme TalkSpike \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build 2>&1 | tee device-build.log | grep -E "error:|BUILD|\*\* " || true
          grep -q "BUILD SUCCEEDED" device-build.log
      - name: Package .ipa
        working-directory: ios-talk-spike
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/TalkSpike.app Payload/
          zip -qr TalkSpike-unsigned.ipa Payload
          ls -la TalkSpike-unsigned.ipa
      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: TalkSpike-unsigned-ipa
          path: ios-talk-spike/TalkSpike-unsigned.ipa
